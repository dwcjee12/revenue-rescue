<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign in · Revenue Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app.css"></head>
<body><div class="authwrap"><div class="authbox card"><a class="brand" href="/login.html" style="padding:0 0 14px"><i></i>Revenue Rescue</a><div class="seg" role="group" aria-label="Mode"><button id="m-in" type="button" aria-pressed="true">Sign in</button><button id="m-up" type="button" aria-pressed="false">Create account</button></div>
<p class="notice small" id="inv" hidden style="margin-top:12px">You were invited to a workspace. Sign in or create an account with the invited email address.</p>
<form id="f" novalidate><div id="up1" hidden><label for="nm">Your name</label><input id="nm" autocomplete="name"><label for="wn" id="wnl">Company name</label><input id="wn" autocomplete="organization"></div>
<label for="em">Email</label><input id="em" type="email" autocomplete="email" required><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required><p class="small mut" id="pwh" hidden>At least 10 characters.</p>
<p class="small" id="err" role="alert" style="color:var(--bad);min-height:1.2em;margin-top:10px"></p><button class="p" id="go" type="submit" style="width:100%;justify-content:center">Sign in</button><p class="small" style="margin-top:12px;text-align:center"><a href="#" id="fg">Forgot your password?</a></p></form><div id="rec" hidden></div><form id="rf" hidden novalidate><h2>Reset your password</h2><p class="small mut">Use one of the recovery codes you saved when you created your account.</p><label for="re">Email</label><input id="re" type="email"><label for="rc">Recovery code</label><input id="rc" autocomplete="off" placeholder="xxxxxxxx-xxxxxxxx"><label for="rp">New password</label><input id="rp" type="password" autocomplete="new-password"><p class="small" id="rerr" role="alert" style="color:var(--bad);min-height:1.2em"></p><button class="p" type="submit" style="width:100%;justify-content:center">Set new password</button><p class="small" style="margin-top:12px;text-align:center"><a href="#" id="bk">Back to sign in</a></p></form></div></div>
<script src="/js/app.js"></script><script src="/js/login.js"></script></body></html>
